name: Verify iOS template
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/bridge.test.cjs scripts/config.test.mjs scripts/location.test.cjs
      - name: Parse Swift sources
        run: find AppifyWebiOS Tests -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile and run policy tests on an iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for values in d["devices"].values() for v in values if "iPhone" in v["name"]))')
          xcodebuild test -project AppifyWebiOS.xcodeproj -scheme AppifyWebiOS -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
