name: Build iOS App
run-name: Build iOS app
on:
  repository_dispatch:
    types: [build-ios-request]
  workflow_dispatch:
    inputs:
      app_token:
        description: Platform app token
        required: true
      app_id:
        description: App ID
        required: true
      build_id:
        description: Build ID
        required: true
      app_name:
        description: App display name
        default: AppifyWeb
      logo_url:
        description: HTTPS app logo URL
      splash_url:
        description: HTTPS wizard artwork URL
      secondary_color:
        description: Launch background hex color
        default: '#FFFFFF'
      api_url:
        description: HTTPS API base URL
        default: https://www.appifyweb24.com/backend/index.php/
      target_url:
        description: HTTPS website URL (including app-mode query)
      package_name:
        description: Apple bundle identifier
        default: com.example.appifyweb
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bridge and configuration rules
        run: node --test scripts/bridge.test.cjs scripts/config.test.mjs scripts/location.test.cjs
      - name: Configure from backend payload
        run: node scripts/prepare-build.mjs
      - name: Prepare exact wizard branding
        run: |
          python3 -m venv .build-tools
          .build-tools/bin/pip install Pillow
          .build-tools/bin/python scripts/prepare_assets.py
      - name: Optional Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > AppifyWebiOS/GoogleService-Info.plist
            plutil -lint AppifyWebiOS/GoogleService-Info.plist
          fi
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild build -project AppifyWebiOS.xcodeproj -scheme AppifyWebiOS -destination 'generic/platform=iOS' -configuration Release -derivedDataPath DerivedData CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package actual app bundle
        run: |
          APP_PATH='DerivedData/Build/Products/Release-iphoneos/AppifyWebiOS.app'
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr app-unsigned.ipa Payload
          printf '%s\n' 'Unsigned build artifact: sign with the matching Apple certificate and provisioning profile before device installation.' > SIGNING_REQUIRED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: |
            app-unsigned.ipa
            SIGNING_REQUIRED.txt
          if-no-files-found: error
      - name: Report build artifact to backend
        run: node scripts/report-build.mjs
