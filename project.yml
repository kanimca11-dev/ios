name: AppifyWebiOS
options:
  bundleIdPrefix: com.example.appifyweb
  deploymentTarget:
    iOS: "15.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  AppifyWebiOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AppifyWebiOS
        excludes: ["Resources"]
      - path: AppifyWebiOS/Resources
        buildPhase: resources
    dependencies:
      - sdk: LocalAuthentication.framework
      - sdk: Network.framework
      - sdk: WebKit.framework
      - sdk: UserNotifications.framework
      - sdk: SafariServices.framework
      - sdk: CoreLocation.framework
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.appifyweb
        INFOPLIST_FILE: AppifyWebiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppifyWebiOS/AppifyWeb.entitlements
        APS_ENVIRONMENT: development
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: AppifyWebiOS/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: "APPIFYWEB_DISPLAY_NAME"
        API_BASE_URL: "https://www.appifyweb24.com/backend/index.php"
        APP_TOKEN: "default_token"
        NSFaceIDUsageDescription: "Verify your identity to unlock this app."
        NSCameraUsageDescription: "Use your camera when you choose to upload a photo or start a video call."
        NSMicrophoneUsageDescription: "Use your microphone when you start an audio or video call."
        NSPhotoLibraryUsageDescription: "Choose photos to upload."
        NSLocationWhenInUseUsageDescription: "Share your location when you request a location feature."
        UILaunchStoryboardName: LaunchScreen
        UIUserInterfaceStyle: Light
        UIViewControllerBasedStatusBarAppearance: true
        FirebaseMessagingAutoInitEnabled: false
        FirebaseAppDelegateProxyEnabled: false
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
  AppifyWebiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AppifyWebiOS
schemes:
  AppifyWebiOS:
    build:
      targets:
        AppifyWebiOS: all
    test:
      targets: [AppifyWebiOSTests]
